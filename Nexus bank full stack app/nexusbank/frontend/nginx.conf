server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://internal-nexus-internal-alb-731087706.us-east-1.elb.amazonaws.com;
        # Replace the above ALB with your API Gateway URL or Internal Load Balancer URL when deploying in production

        # proxy_pass http://api-gateway:8080; # Comment out the Above ALB and use this when deploying in lnon-prod or for testing purpose
        # Here api-gateway:8080 is the docker container DNS name

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}