services:
  eureka-server:
    build:
      context: ../../infrastructure/eureka-server
      dockerfile: Dockerfile
    container_name: nexusbank-eureka
    ports:
      - "8761:8761"
    environment:
      - EUREKA_USERNAME=admin
      - EUREKA_PASSWORD=admin123
    networks:
      - nexusbank-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://admin:admin123@localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  config-server:
    build:
      context: ../../infrastructure/config-server
      dockerfile: Dockerfile
    container_name: nexusbank-config
    ports:
      - "8888:8888"
    depends_on:
      eureka-server:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://admin:admin123@eureka-server:8761/eureka/
    networks:
      - nexusbank-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  api-gateway:
    build:
      context: ../../infrastructure/api-gateway
      dockerfile: Dockerfile
    container_name: nexusbank-gateway
    ports:
      - "8080:8080"
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://admin:admin123@eureka-server:8761/eureka/
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
    networks:
      - nexusbank-network

  mysql:
    image: mysql:8.0
    container_name: nexusbank-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: nexusbank_customer
      MYSQL_USER: nexususer
      MYSQL_PASSWORD: nexuspass
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql-data:/var/lib/mysql
    networks:
      - nexusbank-network

  customer-service:
    build:
      context: ../../customer-service
      dockerfile: Dockerfile
    container_name: nexusbank-customer
    ports:
      - "8081:8081"
    depends_on:
      config-server:
        condition: service_healthy
      mysql:
        condition: service_started
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://admin:admin123@eureka-server:8761/eureka/
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/nexusbank_customer?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=nexususer
      - SPRING_DATASOURCE_PASSWORD=nexuspass
    networks:
      - nexusbank-network

  admin-service:
    build:
      context: ../../admin-service
      dockerfile: Dockerfile
    container_name: nexusbank-admin
    ports:
      - "8082:8082"
    depends_on:
      customer-service:
        condition: service_started
      mysql:
        condition: service_started
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://admin:admin123@eureka-server:8761/eureka/
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/nexusbank_admin?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=nexususer
      - SPRING_DATASOURCE_PASSWORD=nexuspass
    networks:
      - nexusbank-network

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: nexusbank-frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - nexusbank-network

volumes:
  mysql-data:

networks:
  nexusbank-network:
    driver: bridge
