name: NexusBank CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: Run Tests - Customer Service
        run: |
          cd customer-service
          mvn test

      - name: Run Tests - Admin Service
        run: |
          cd admin-service
          mvn test

      - name: Publish Test Results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results
          path: '**/target/surefire-reports/'

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build All Services
        run: |
          for service in infrastructure/eureka-server infrastructure/config-server infrastructure/api-gateway customer-service admin-service; do
            cd $service
            mvn clean package -DskipTests
            cd ../..
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Images
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/nexusbank-eureka:latest infrastructure/eureka-server
          docker build -t ${{ secrets.DOCKER_USERNAME }}/nexusbank-config:latest infrastructure/config-server
          docker build -t ${{ secrets.DOCKER_USERNAME }}/nexusbank-gateway:latest infrastructure/api-gateway
          docker build -t ${{ secrets.DOCKER_USERNAME }}/nexusbank-customer:latest customer-service
          docker build -t ${{ secrets.DOCKER_USERNAME }}/nexusbank-admin:latest admin-service
          docker push ${{ secrets.DOCKER_USERNAME }}/nexusbank-eureka:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/nexusbank-config:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/nexusbank-gateway:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/nexusbank-customer:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/nexusbank-admin:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Kubernetes
        uses: azure/k8s-deploy@v1
        with:
          manifests: |
            devops/k8s/
          images: |
            ${{ secrets.DOCKER_USERNAME }}/nexusbank-eureka:latest
            ${{ secrets.DOCKER_USERNAME }}/nexusbank-customer:latest
            ${{ secrets.DOCKER_USERNAME }}/nexusbank-admin:latest
